[package]
name = "zeroc"
version = "0.3.0"
edition = "2021"

[dependencies]
zeroc-ast = { path = "crates/zeroc-ast" }
zeroc-codegen = { path = "crates/zeroc-codegen" }
zeroc-diag = { path = "crates/zeroc-diag" }
zeroc-fmt = { path = "crates/zeroc-fmt" }
zeroc-import = { path = "crates/zeroc-import" }
zeroc-lexer = { path = "crates/zeroc-lexer" }
zeroc-parser = { path = "crates/zeroc-parser" }
zeroc-scope = { path = "crates/zeroc-scope" }

[[bin]]
name = "zero"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["crates/*"]
