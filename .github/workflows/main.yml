name: main

# Runs on every commit pushed to `main` (and on PRs targeting it).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Run tests
        run: cargo test
      - name: Build release
        run: cargo build --release
